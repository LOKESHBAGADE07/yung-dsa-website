name: One-off production mobile review
on:
  push:
    branches: ['audit/mobile-review-20261128']
    paths: ['.github/workflows/mobile-review-once.yml']
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install pinned mobile test tools
        run: |
          mkdir -p "$RUNNER_TEMP/mobile-review"
          cd "$RUNNER_TEMP/mobile-review"
          npm install --no-audit --no-fund lighthouse@12.8.2 playwright-core@1.56.0
      - name: Verify the live font and hero requests
        working-directory: ${{ runner.temp }}/mobile-review
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright-core';
          import assert from 'node:assert/strict';
          import {setTimeout as delay} from 'node:timers/promises';
          const base='https://yungdsa.com';
          for(let i=0;i<30;i++){
            try {
              const r=await fetch(base+'/fonts/site.css');
              if(r.ok && (await r.text()).includes('Space Grotesk')) break;
            } catch {}
            if(i===29) throw Error('Latest font assets not live');
            await delay(4000);
          }
          const b=await chromium.launch({channel:'chrome',args:['--no-sandbox']});
          try{
            const page=await b.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
            const req=[];
            page.on('request',r=>req.push(r.url()));
            const response=await page.goto(base+'/',{waitUntil:'load'});
            await page.evaluate(()=>document.fonts.ready);
            const data=await page.evaluate(()=>{
              const hero=document.querySelector('[data-testid="hero-image"]');
              const fonts=performance.getEntriesByType('resource').filter(r=>r.name.endsWith('.woff2')).map(r=>r.name);
              const imageEntries=performance.getEntriesByName(hero.currentSrc).map(entry=>entry.initiatorType);
              return {fonts,hero:hero.currentSrc,heroWidth:hero.naturalWidth,preload:document.head.querySelector('link[as="image"]')?.imageSrcset,initiators:imageEntries};
            });
            assert(data.fonts.length>0 && data.fonts.every(x=>x.startsWith(base+'/fonts/files/')));
            assert(!req.some(x=>/^https:\/\/fonts\.(googleapis|gstatic)\.com\//.test(x)||/emergent\.sh|googlesyndication\.com|\/_vercel\/(insights|speed-insights)/.test(x)));
            assert(data.heroWidth>0 && data.preload && data.initiators.length===1);
            assert(response.headers()['content-security-policy'].includes("font-src 'self'"));
            console.log('VERIFIED RESOURCES '+JSON.stringify(data));
          }finally{await b.close();}
          JS
      - name: Measure the deployed homepage on mobile three times
        working-directory: ${{ runner.temp }}/mobile-review
        run: |
          export CHROME_PATH="$(command -v google-chrome)"
          for run in 1 2 3; do
            ./node_modules/.bin/lighthouse https://yungdsa.com/ --quiet --only-categories=performance,accessibility,best-practices,seo --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="mobile-$run.json"
          done
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          for (const n of [1,2,3]) {
            const l=JSON.parse(fs.readFileSync('mobile-'+n+'.json'));
            if(l.runtimeError || !l.finalDisplayedUrl?.startsWith('https://yungdsa.com/')) throw Error('Unexpected audit response '+JSON.stringify(l.runtimeError));
            const a=l.audits;
            if(n===3) console.log('A11Y REMAINING '+JSON.stringify(l.categories.accessibility.auditRefs.filter(x=>a[x.id].score===0).map(x=>({id:x.id,nodes:a[x.id].details?.items?.map(i=>i.node?.selector).slice(0,20)}))));
            console.log('MOBILE RESULT '+JSON.stringify({run:n,version:l.lighthouseVersion,url:l.finalDisplayedUrl,device:l.configSettings.formFactor,scores:Object.fromEntries(Object.entries(l.categories).map(([k,v])=>[k,Math.round(100*v.score)])),fcp:a['first-contentful-paint'].numericValue,lcp:a['largest-contentful-paint'].numericValue,tbt:a['total-blocking-time'].numericValue,cls:a['cumulative-layout-shift'].numericValue}));
          }
          JS
