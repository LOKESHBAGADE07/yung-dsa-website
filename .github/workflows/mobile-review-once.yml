name: Stage verified open font assets
on:
  push:
    branches: ['audit/mobile-review-20261128']
    paths: ['.github/workflows/mobile-review-once.yml']
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 'de13d5c8f6ad901949c580036f009b79ea39b670'
      - name: Copy the eight pinned WOFF2 files and their original licenses
        run: |
          python - <<'PY'
          from hashlib import sha1
          from pathlib import Path
          from urllib.request import urlopen
          pin = '5a72889057f592bb0659629e38337359f94d53b2'
          expected = {"space-grotesk/files/space-grotesk-latin-ext-wght-normal.woff2":"db732c272dc2d48c5600b88ca24d2206fb123bd4","space-grotesk/files/space-grotesk-latin-wght-normal.woff2":"0f3474ee8af2f8253225f3b41bf79be986a1ae13","unbounded/files/unbounded-latin-ext-wght-normal.woff2":"e17f7659b355f822d9c0f039b8f74d52dc4104fe","unbounded/files/unbounded-latin-wght-normal.woff2":"3260a1939eb5a3020b48235c1a52852080f929b6","dm-sans/files/dm-sans-latin-ext-wght-normal.woff2":"db39c6263056cff430c828fe7035b9ba5edaa6ee","dm-sans/files/dm-sans-latin-wght-normal.woff2":"01383d7e5c4340847b8fe4570ad0458e6582989d","manrope/files/manrope-latin-ext-wght-normal.woff2":"bd24140af06f1b5897d3bbd6538a74b03748a21e","manrope/files/manrope-latin-wght-normal.woff2":"71eb731d558046199aa7f985adbf812890a093a1"}
          target = Path('frontend/public/fonts')
          (target / 'files').mkdir(parents=True)
          (target / 'licenses').mkdir()
          for path, digest in expected.items():
              with urlopen(f'https://raw.githubusercontent.com/fontsource/font-files/{pin}/fonts/variable/{path}', timeout=20) as resp:
                  data = resp.read()
              assert data[:4] == b'wOF2'
              assert sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == digest
              (target / 'files' / Path(path).name).write_bytes(data)
          for family in sorted({p.split('/')[0] for p in expected}):
              with urlopen(f'https://raw.githubusercontent.com/fontsource/font-files/{pin}/fonts/variable/{family}/LICENSE', timeout=20) as resp:
                  data = resp.read()
              assert b'SIL OPEN FONT LICENSE' in data.upper()
              (target / 'licenses' / (family+'.txt')).write_bytes(data)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/public/fonts/
          git commit -m 'Vendor verified font subsets and original Open Font Licenses'
          git push origin HEAD:refs/heads/codex/font-assets-20261128
