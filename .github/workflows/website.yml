name: Website build and SEO checks
on:
  push:
    paths: ['frontend/**', 'vercel.json', '.github/workflows/website.yml']
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install existing locked dependencies
        run: yarn install --frozen-lockfile
      - name: Build, prerender and verify SEO and hydration
        run: yarn build
      - name: Verify style filtering and static guides
        run: yarn test:style
      - name: Install browser test tools and the receipt handler's dependencies
        run: python -m pip install --quiet playwright==1.56.0 -r requirements.txt
      - name: Verify receipt validation and browser interactions
        run: |
          python scripts/test_fit_receipts.py
          python scripts/fit_browser.py
      - name: Save responsive Fit Check previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fit-check-previews
          path: ${{ runner.temp }}/fit-check-screens
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify published Fit Check receipts
        if: github.ref == 'refs/heads/main'
        run: python scripts/fit_browser.py --production
      - name: Observe public HTTP routes
        if: always()
        continue-on-error: true
        run: node scripts/check-live-seo.cjs
