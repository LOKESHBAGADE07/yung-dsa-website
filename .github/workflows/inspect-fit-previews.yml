name: Inspect Fit Check previews
on:
  push:
    branches: [codex/photographic-style-edit]
    paths: [.github/workflows/inspect-fit-previews.yml]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fit-check-previews
          run-id: 45870695923
          github-token: ${{ github.token }}
          path: screens
      - name: Render images for review
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import base64, io
          from PIL import Image
          for name, width in [('builder-390',390),('builder-1440',830),('result-320',320),('share-card',440)]:
              image=Image.open('screens/'+name+'.png').convert('RGB')
              image.thumbnail((width,1800))
              buf=io.BytesIO()
              image.save(buf,format='WEBP',quality=68,method=5)
              encoded=base64.b64encode(buf.getvalue()).decode()
              for n in range(0,len(encoded),4800):
                  print('REVIEW '+name+' '+str(n)+' '+encoded[n:n+4800])
          PY
